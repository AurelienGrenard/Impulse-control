[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-control"
version = "1.0.0"
description = "Reproducibility artifact for neural regression and randomized impulse optimization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "scipy", "matplotlib"]
authors = [
  {name = "Lokman Abbas Turki"},
  {name = "Aurélien Grenard"},
  {name = "Idris Kharroubi"},
  {name = "Qinghua Li"},
  {name = "Antonio Ocello"},
]

[tool.setuptools]
packages = ["impulse_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
