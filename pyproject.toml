[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impulse-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "scipy", "matplotlib"]

[tool.setuptools]
packages = ["impulse_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
